prepare:
    needs: check-if-merged
    if: needs.check-if-merged.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
        checkout_sha: ${{ steps.baseline.outputs.checkout_sha }}
        ready: ${{ steps.baseline.outputs.ready }}
        outcome: ${{ steps.baseline.outputs.outcome }}
    steps:
        # Sole bootstrap exception: read-only helper loading at original event SHA.
        - name: Bootstrap baseline helper
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
          with:
              ref: ${{ github.sha }}
              persist-credentials: false
              fetch-depth: 0
        - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
          with:
              node-version: 24
        - name: Select tested baseline
          id: baseline
          env:
              EVENT_NAME: ${{ github.event_name }}
              EVENT_SHA: ${{ github.sha }}
              EVENT_REF: ${{ github.ref }}
              PR_FOUND: ${{ needs.check-if-merged.outputs.should_run }}
              HAS_SKIP_LABEL: ${{ needs.check-if-merged.outputs.has_skip_label }}
              INPUT_VERSION: ${{ github.event.inputs.version_bump }}
          run: node .github/scripts/release-publication.mjs prepare
