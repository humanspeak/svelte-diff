packages:
    - .
    - docs
allowBuilds:
    '@humanspeak/docs-kit@git+https://github.com/humanspeak/docs-kit.git': true
    '@humanspeak/docs-kit@https://codeload.github.com/humanspeak/docs-kit/tar.gz/47475084e800eba2b8eaf5d783b1b9bdf3f65278': true
    # pnpm 11 matches git-hosted dependencies by package name and resolved URL.
    # Refresh this commit when the docs-kit tag in docs/package.json changes.
    '@sentry/cli': true
    esbuild: true
    sharp: true
    workerd: true
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
    - '@humanspeak/*'
